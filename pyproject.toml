[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundation-model-lab"
version = "0.1.0"
description = "Visual, reproducible toy experiments for foundation models, multimodal models, and ML systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sungmok Kim", email = "darkha123@gmail.com" }]
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "torch>=2.5",
]

[project.optional-dependencies]
llm = [
  "accelerate>=1.2",
  "datasets>=3.2",
  "transformers>=4.51",
  "peft>=0.14",
  "trl>=0.15",
  "bitsandbytes>=0.45; platform_system == 'Linux'",
  "sentencepiece>=0.2",
]
vlm = [
  "Pillow>=10",
  "transformers>=4.57",
  "accelerate>=1.2",
  "peft>=0.14",
]
ml = ["scikit-learn>=1.5", "networkx>=3.2", "pandas>=2.2"]
dev = ["pytest>=8", "ruff==0.15.10"]
all = [
  "accelerate>=1.2",
  "bitsandbytes>=0.45; platform_system == 'Linux'",
  "datasets>=3.2",
  "networkx>=3.2",
  "pandas>=2.2",
  "peft>=0.14",
  "Pillow>=10",
  "pytest>=8",
  "scikit-learn>=1.5",
  "sentencepiece>=0.2",
  "transformers>=4.57",
  "trl>=0.15",
]

[project.scripts]
fmlab = "fmlab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
