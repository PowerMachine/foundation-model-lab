<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Distributed correctness case study</title>
<desc id="desc">11/11 correctness gates passed. This is a real two-process CPU/Gloo correctness study on one tiny deterministic workload. It makes no NCCL, multi-node, convergence, or scaling claim.</desc>
