<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect width="1200" height="675" rx="32" fill="url(#glow)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#a4bcd9" stroke-opacity=".22"/>
