name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CUDA_VISIBLE_DEVICES: ""
  HF_DATASETS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_OFFLINE: "1"
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  TOKENIZERS_PARALLELISM: "false"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  quality:
    name: CPU/offline · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Prepare isolated runtime roots
        run: |
          runtime_root="$RUNNER_TEMP/foundation-model-lab"
          {
            echo "FMLAB_DATA_ROOT=$runtime_root/data"
            echo "FMLAB_MODEL_ROOT=$runtime_root/empty-models"
            echo "HF_HOME=$runtime_root/cache/huggingface"
            echo "TORCH_HOME=$runtime_root/cache/torch"
          } >> "$GITHUB_ENV"
          mkdir -p \
            "$runtime_root/data" \
            "$runtime_root/empty-models" \
            "$runtime_root/cache/huggingface" \
            "$runtime_root/cache/torch"
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,ml,vlm]'
          python -m pip check
      - name: Validate repository metadata
        if: matrix.python-version == '3.12'
        run: python .github/scripts/validate_repository_metadata.py .
      - name: Lint
        if: matrix.python-version == '3.12'
        run: python -m ruff check src scripts tests .github/scripts
      - name: Format check
        if: matrix.python-version == '3.12'
        run: python -m ruff format --check src scripts tests .github/scripts
      - name: Unit and integration tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Bounded download-free toy suite
        if: matrix.python-version == '3.12'
        run: |
          python scripts/run_toy_suite.py \
            --output-root "${{ runner.temp }}/foundation-model-lab/toy-suite" \
            --device cpu \
            --llm-steps 1 \
            --tiny-steps 2 \
            --vlm-samples 1 \
            --fail-fast

  public-evidence:
    name: Public-evidence integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify manifests, hashes, redaction boundary, and index coverage
        run: python .github/scripts/verify_public_evidence.py public-evidence

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
